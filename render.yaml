services:
  - type: web
    name: tanmay-site-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ADMIN_KEY
        value: tanmay-admin-2026
      - key: PYTHON_VERSION
        value: "3.11.0"
    plan: free
